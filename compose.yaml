name: finances-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: finances
      POSTGRES_PASSWORD: finances
      POSTGRES_DB: finances_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - finances_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finances -d finances_dev"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  finances_postgres_data:
