name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:online
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Package immutable artifact
        run: tar -czf finances-${GITHUB_SHA}.tar.gz apps/api/dist apps/web/dist packages/*/dist package.json pnpm-lock.yaml pnpm-workspace.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: finances-${{ github.sha }}
          path: finances-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: finances
          POSTGRES_PASSWORD: finances
          POSTGRES_DB: finances_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finances -d finances_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_DIALECT: postgres
      DATABASE_URL: postgresql://finances:finances@localhost:5432/finances_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @finances/database db:migrate:postgres
      - run: pnpm --filter @finances/api exec vitest run src/postgres-integration.test.ts
